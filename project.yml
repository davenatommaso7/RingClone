# Progetto Xcode generato con XcodeGen (https://github.com/yonaskolb/XcodeGen):  brew install xcodegen && xcodegen
# ATTENZIONE: questo file NON è stato provato (nell'ambiente in cui è stato scritto non c'è Xcode).
# Se la generazione dà errori, segui la procedura manuale in docs/CONFIGURAZIONE_XCODE.md.
name: RingClone
options:
  bundleIdPrefix: it.ringclone
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  RingCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"          # le app in modalità Swift 5; il pacchetto RingCore è in modalità Swift 6
    DEVELOPMENT_TEAM: ""          # inserisci il tuo Team ID
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RingClone:
    type: application
    platform: iOS
    sources: [Apps/iOS]
    dependencies:
      - package: RingCore
      - target: RingCloneWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ringclone.app
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Ring
        UILaunchScreen: {}
        NSHealthShareUsageDescription: "L'app legge battito, sonno, passi, temperatura del polso e allenamenti per calcolare i punteggi di sonno, recupero e attività."
        NSHealthUpdateUsageDescription: "L'app non scrive dati in Salute dall'iPhone."
        BGTaskSchedulerPermittedIdentifiers: [it.ringclone.refresh]
        UIBackgroundModes: [fetch, processing]
    entitlements:
      path: Apps/iOS/RingClone.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
  RingCloneWatch:
    type: application
    platform: watchOS
    sources: [Apps/watchOS]
    dependencies:
      - package: RingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ringclone.app.watchkitapp
    info:
      path: Apps/watchOS/Info.plist
      properties:
        CFBundleDisplayName: Ring
        WKApplication: true
        WKCompanionAppBundleIdentifier: it.ringclone.app
        WKBackgroundModes: [workout-processing]
        NSMotionUsageDescription: "Il movimento del polso serve a riconoscere sonno, passi e attività."
        NSHealthShareUsageDescription: "Durante l'allenamento l'app legge la frequenza cardiaca per mostrare la zona in tempo reale."
        NSHealthUpdateUsageDescription: "Gli allenamenti avviati dal Watch vengono salvati in Salute."
    entitlements:
      path: Apps/watchOS/RingCloneWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
